%YAML:1.0

#support: 1 imu 1 cam; 1 imu 2 cam: 2 cam; 
imu: 1   
num_of_cam: 1  

imu_topic: "/imu_bridge/data_raw"
image0_topic: "/camera/image_raw"
image1_topic: "/cam1/image_raw"
output_path: "~/vins_output/"

cam0_calib: "cam0_wide.yaml"
cam1_calib: "cam1_wide.yaml"
image_width: 640
image_height: 480

estimate_extrinsic: 2   # 0  have an accurate extrinsic parameters. dont change it!! :3
                        # 1  have an initial guess about extrinsic parameters
                        # 2  don't know anything about extrinsic parameters

body_T_cam0: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [1, 0, 0, 0.0762,
          0, 1, 0, 0.02032,
          0, 0, 1, 0,
          0, 0, 0, 1]

multiple_thread: 1

#feature tracker parameters
max_cnt: 150            # max feature number in feature tracking
min_dist: 30            # min distance between two features 
freq: 2                 # frequency (Hz) of publish tracking result. Lower for high-res images
F_threshold: 1.0        # ransac threshold (pixel)
show_track: 1           # publish tracking image as topic
flow_back: 1            # perform forward and backward optical flow to improve feature tracking accuracy

#optimization parameters
max_solver_time: 0.04  # max solver iteration time (ms), to guarantee real time
max_num_iterations: 8   # max solver iterations, to guarantee real time
keyframe_parallax: 10.0 # keyframe selection threshold (pixel)

#imu parameters (not used since imu: 0, but required for compilation)
acc_n: 0.1          # accelerometer measurement noise standard deviation
gyr_n: 0.01         # gyroscope measurement noise standard deviation 
acc_w: 0.001        # accelerometer bias random work noise standard deviation
gyr_w: 0.0001       # gyroscope bias random work noise standard deviation   
g_norm: 9.81007     # gravity magnitude

#unsynchronization parameters
estimate_td: 0                      # online estimate time offset between camera and imu
td: 0.0                             # initial value of time offset. unit: s. readed image clock + td = real image clock (IMU clock)

#loop closure parameters
load_previous_pose_graph: 0        # load and reuse previous pose graph, load from 'pose_graph_save_path'
pose_graph_save_path: "~/vins_output/pose_graph/" # save and load path
save_image: 1                   # save image in pose graph for visualization purpose, also close by setting 0