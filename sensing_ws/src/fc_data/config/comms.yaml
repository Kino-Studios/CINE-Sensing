# MAVROS Communication Configuration
# Serial and UDP connection settings for flight controller communication

mavros:
  ros__parameters:
    # Serial connection to flight controller
    fcu_url: "/dev/ttyAMA0:921600"
    gcs_url: ""
    target_system_id: 1
    target_component_id: 1

    # UDP connection (alternative)
    # fcu_url: "udp://:14540@127.0.0.1:14557"
