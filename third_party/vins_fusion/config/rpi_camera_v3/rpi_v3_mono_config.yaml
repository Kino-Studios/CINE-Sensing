%YAML:1.0
---
imu: 1
num_of_cam: 1

imu_topic: "/imu_bridge/data_raw"
image0_topic: "/camera/image_raw"

# Launcher (run_vins.py / launch_complete_vio.py) overrides this with a resolved
# absolute path in the generated config. This relative default is a safe fallback
# for direct vins_node launches (writes under cwd, not filesystem root).
output_path: "vins_output/"

cam0_intrinsics: [750.99681791, 748.9227188, 578.86898934, 326.60855341]
cam0_distortion_coeffs: [-0.04369182, 0.04562136, 0.00000456, 0.0003494, 0]
cam0_calib: "cam0_wide.yaml"
image_width: 1152
image_height: 648

# body_T_cam0: 4x4 camera->body(IMU) extrinsic, used fixed (estimate_extrinsic: 0,
# i.e. NOT refined online by VINS).
# Provenance (from repo evidence, 2026-06-13): these values first appear together
# as a single block in commit ada6c39 "cleanup and naming changes" (2026-01-03)
# and have not changed since. The repo's calibration/ dir contains a Kalibr
# camera-IMU dataset (calibration/kalibr_bags/kalibr_cam/) and a camera intrinsics
# calibration (calibration/calibrate_camera.py + camera_calibration.yaml), which is
# the most likely origin of this extrinsic. However there is NO camchain/Kalibr
# output yaml or vins_output/extrinsic_parameter.csv checked into the repo that
# directly produces these exact numbers, so the provenance is INFERRED, not proven.
# TODO(hardware): re-derive from a fresh Kalibr cam-IMU calibration and record the
# source file/run here. Do not hand-edit these values without that calibration.
estimate_extrinsic: 0
body_T_cam0:
  rows: 4
  cols: 4
  dt: d
  data:
    [
      -0.70894393,
      0.08628109,
      -0.6999672,
      0.00392914,
      -0.7052093,
      -0.07426853,
      0.70509859,
      0.00097993,
      0.00885114,
      0.99349875,
      0.11349845,
      -0.01318157,
      0,
      0,
      0,
      1,
    ]

multiple_thread: 1
feature_tracker: 1
min_parallax: 8
max_cnt: 250
min_dist: 15
freq: 30
F_threshold: 1.5
detect_threshold: 10
show_track: 1
flow_back: 1
equalize: 1
clahe_clip: 3.0
pyramid_levels: 5
win_size: 25

# optimizer
keyframe_parallax: 10.0

acc_n: 0.1
gyr_n: 0.01
acc_w: 0.00002
gyr_w: 0.00002
g_norm: 9.81

gravity_aligned: 1

# time offset
estimate_td: 0
td: -0.031551662509982356
tr: 0.0

loop_closure: 1
load_previous_pose_graph: 0
# Launcher overrides this with a resolved absolute path in the generated config.
# This relative default is a safe fallback for direct vins_node launches.
pose_graph_save_path: "vins_output/pose_graph/"
save_image: 0

# Depth usage
use_depth: 0
depth_topic: "/camera/depth/image_rect_raw"
