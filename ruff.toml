line-length = 100
target-version = "py310"

extend-exclude = [
    "third_party",
    "venv",
    ".venv",
    "install",
    "build",
    "log",
]

[lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",   # line length handled by formatter
    "F841",   # local variable assigned but never used: plot handles kept for API symmetry
    "E741",   # ambiguous variable name: tolerate single-letter loop vars in viz scripts
]

[format]
quote-style = "single"
